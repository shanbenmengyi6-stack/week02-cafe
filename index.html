<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSSE CAFEメニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<header class="bg-white shadow px-8 py-4">
    <h1 class="text-2xl font-bold text-gray-800">POSSE CAFE</h1>
    <p class="text-gray-600 mt-1">メニュー</p>
</header>    
<main class="max-w-4xl mx-auto px-4 py-8">
    <section class="mb-10">
        <h2 class="text-xl font-bold text-gray-800 mb-4">ドリンク</h2>
        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:bg-gray-100">
                <h3 class="text-lg font-bold text-gray-900">コーヒー</h3>
                <p class="text-sm text-gray-600">香り高いブレンドコーヒー</p>
                <p class="text-gray-600 font-bold mt-2">¥400</p>
            </div>
        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:bg-gray-100">
                <h3 class="text-lg font-bold text-gray-900">紅茶</h3>
                <p class="text-sm text-gray-600">フルーティーなアールグレイ</p>
                <p class="text-gray-600 font-bold mt-2">¥350</p>
            </div>
        </section>
    <section class="mb-10">
        <h2 class="text-xl font-bold text-gray-800 mb-4">フード</h2>
        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:bg-gray-100">
                <h3 class="text-lg font-bold text-gray-900">サンドイッチ</h3>
                <p class="text-sm text-gray-600">新鮮な野菜とハムのサンドイッチ</p>
                <p class="text-gray-600 font-bold mt-2">¥500</p>
            </div>
        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:bg-gray-100">
                <h3 class="text-lg font-bold text-gray-900">ケーキセット</h3>
                <p class="text-sm text-gray-600">季節のケーキとドリンクのセット</p>
                <p class="text-gray-600 font-bold mt-2">¥700</p>
            </div>
        </section>
</main>
</body>
</html>
